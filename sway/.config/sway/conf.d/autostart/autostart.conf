### Autostart

exec mako
exec_always sh -c 'pkill -x waybar; sleep 0.3; waybar'

# Wallpaper (swww) : daemon puis restauration des fonds par output
exec swww-daemon
exec ~/.config/sway/scripts/wallpaper-restore.sh

# Écrans : kanshi rejoue le profil nwg-displays au branchement / débranchement.
# `exec` et non `exec_always` : inutile de le relancer à chaque reload, il
# recharge sa config tout seul sur SIGHUP.
exec kanshi
